name: Marketing CI/CD

on:
  push:
    branches: ["main", "master", "develop"]
    tags: ["*"]

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1: TESTING (CI)
  # Jalan di SETIAP push ke main/master/develop, dan di setiap tag.
  # ══════════════════════════════════════════════════════════
  laravel-tests:
    name: 🧪 Run Tests (CI)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: laravel_testing
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, curl, zip, gd, intl
          coverage: none

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: 📋 Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: 🔧 Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 🏗️ Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: ✅ Verify Vite manifest was actually generated
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "❌ public/build/manifest.json tidak ditemukan setelah npm run build!"
            exit 1
          fi
          echo "✅ Vite manifest ditemukan."

      - name: 🔑 Generate App Key
        run: php artisan key:generate

      - name: 🔐 Set Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: ⏳ Wait for MariaDB to be fully ready
        run: |
          echo "Waiting for MariaDB to accept connections..."
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "SELECT 1;" laravel_testing > /dev/null 2>&1; then
              echo "✅ MariaDB is ready and accepting queries! (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, waiting 3s..."
            sleep 3
          done
          echo "❌ MariaDB did not become ready in time!"
          exit 1

      - name: ✅ Run Fresh Migration
        run: php artisan migrate:fresh --force --no-interaction

      - name: ✅ Verify No Pending Migrations
        run: |
          STATUS=$(php artisan migrate:status --no-ansi 2>&1)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "Pending"; then
            echo "❌ Ada migration yang pending!"
            exit 1
          fi
          echo "✅ Semua migration sudah berjalan."

      - name: ✅ Verify all Filament Pages are discoverable
        run: |
          echo "Mengecek apakah semua class di app/Filament/Pages berhasil di-load tanpa error..."
          php artisan route:list --path=admin > /dev/null
          echo "✅ Routing admin panel berhasil di-build tanpa fatal error."

  # ══════════════════════════════════════════════════════════
  # JOB 2: DEPLOY (CD)
  # HANYA jalan kalau trigger-nya adalah TAG (misal v1.1.4), bukan push biasa.
  # HANYA jalan kalau job testing di atas lolos semua.
  # ══════════════════════════════════════════════════════════
  deploy-production:
    name: 🚀 Deploy to marketing.wijayaplywoods.com
    needs: laravel-tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 🏗️ Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: ✅ Verify Vite manifest was actually generated
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "❌ public/build/manifest.json tidak ditemukan setelah npm run build!"
            exit 1
          fi
          echo "✅ Vite manifest ditemukan, aman untuk di-deploy."

      - name: 📦 Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🗜️ Create Deployment Package
        run: |
          set -euo pipefail
          BUILD_DIR=./build_deploy
          mkdir -p "$BUILD_DIR"

          # rsync di sini jalan di runner GitHub Actions (ubuntu-latest),
          # BUKAN di shared hosting, jadi aman dipakai. Ini cuma memilah
          # file yang mau dipaket. .env, storage, dan .htaccess SENGAJA
          # tidak diikutkan karena itu milik server (data & config
          # production yang tidak boleh ketimpa oleh isi repo).
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude '.htaccess' \
            --exclude '.env' \
            --exclude 'storage/' \
            ./ "$BUILD_DIR/"

          # Sanity check: pastikan folder-folder penting benar-benar
          # ikut terpaket sebelum dikirim ke server.
          echo "── Isi app/Filament yang akan di-deploy: ──"
          find "$BUILD_DIR/app/Filament" -maxdepth 2 -type d
          echo "── Vite manifest yang akan di-deploy: ──"
          ls -la "$BUILD_DIR/public/build/manifest.json"

          (cd "$BUILD_DIR" && zip -r ../deploy.zip . -q)
          echo "✅ Ukuran paket deploy: $(du -h deploy.zip | cut -f1)"

      - name: 📤 Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.zip"
          target: "/home/${{ secrets.SSH_USERNAME }}"

      - name: ⚙️ Execute Server Commands
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            TARGET_DIR="/home/${{ secrets.SSH_USERNAME }}/marketing.wijayaplywoods.com"
            cd "$TARGET_DIR"

            echo "── 1. Mode Perbaikan ──"
            php artisan down || true

            echo "── 2. Extract paket baru ke folder sementara ──"
            rm -rf /tmp/deploy_extract
            mkdir -p /tmp/deploy_extract
            unzip -oq ../deploy.zip -d /tmp/deploy_extract

            echo "── 3. Sanity check sebelum sync: pastikan folder Pages ada di paket ──"
            if [ ! -d /tmp/deploy_extract/app/Filament/Pages ]; then
              echo "❌ app/Filament/Pages TIDAK ADA di paket deploy! Membatalkan deploy."
              php artisan up || true
              exit 1
            fi
            if [ ! -f /tmp/deploy_extract/public/build/manifest.json ]; then
              echo "❌ Vite manifest TIDAK ADA di paket deploy! Membatalkan deploy."
              php artisan up || true
              exit 1
            fi

            echo "── 4. Sinkronkan ke target, KECUALI storage, .env, .htaccess (tanpa rsync) ──"
            # Shared hosting umumnya TIDAK punya rsync, jadi pakai cp biasa.
            # Hapus dulu dari paket sumber supaya tidak ikut menimpa file
            # milik server (storage berisi upload user, .env & .htaccess
            # adalah config production).
            rm -rf /tmp/deploy_extract/storage
            rm -f  /tmp/deploy_extract/.env
            rm -f  /tmp/deploy_extract/.htaccess

            # Salin semua isi paket ke TARGET_DIR, timpa file yang sama.
            # Catatan: cp TIDAK menghapus file lama di server yang sudah
            # tidak ada lagi di repo (beda dengan rsync --delete). Kalau
            # ada file/folder yang sengaja dihapus dari repo, hapus manual
            # di server atau tambahkan langkah cleanup terpisah.
            cp -a /tmp/deploy_extract/. "$TARGET_DIR/"

            echo "── 5. Bersihkan file sementara ──"
            rm -rf /tmp/deploy_extract
            rm -f ../deploy.zip

            echo "── 6. Set permission storage & cache ──"
            chmod -R 775 storage bootstrap/cache

            echo "── 7. Bersihkan SEMUA cache lama (config, route, view, event, filament) ──"
            php artisan optimize:clear
            php artisan filament:clear-cached-components || true

            echo "── 8. Migrasi Database (aman, hanya menambah yang baru) ──"
            php artisan migrate --force

            echo "── 9. Build ulang cache production ──"
            php artisan filament:cache-components
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "── 10. Verifikasi Page Filament ter-registrasi ──"
            php artisan route:list --path=admin | grep -i "rekap" || echo "⚠️ Peringatan: route 'rekap' tidak ditemukan, cek manual!"

            echo "── 11. Online kembali ──"
            php artisan up

            echo "🚀 Deployment Marketing Sukses!"
